org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Make Gradle dependency resolution more reliable on networks with flaky IPv6/DNS.
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false
org.gradle.parallel=false
org.gradle.workers.max=2
